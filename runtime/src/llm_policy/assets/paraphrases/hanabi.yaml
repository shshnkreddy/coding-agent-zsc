replacements:
  - source: "The two players cooperate to build five public fireworks, one per color. Each firework must contain ranks 1, 2, 3, 4, 5 in that order, without duplicates or skipping ranks. The episode return is the team's score, shared by both players. The maximum is 25. This specification describes game mechanics and data formats; no extra meanings are assigned to a player's choice of action."
    p1: "Both players work together to build the five public fireworks, one for each color. Within a firework, ranks must be 1, 2, 3, 4, 5 in sequence, with neither repeated nor skipped ranks. Both players share the team score as episode return, with a maximum of 25. These rules specify mechanics and data formats, without assigning additional meanings to which action a player chooses."
    p2: "The shared episode return equals the team score and cannot exceed 25. The task for the two cooperating players is to construct five public fireworks, one per color. Each must progress through ranks 1, 2, 3, 4, 5 without repetition or omission. This description covers mechanics and data formats, not additional meanings for players' action choices."
    p3: "Five public fireworks, one for each color, are built cooperatively by the two players. A firework accepts ranks 1, 2, 3, 4, 5 in precisely that sequence; duplicates and skipped ranks are not permitted. Episode return is the shared team score, whose maximum is 25. The specification supplies mechanics and data formats but attaches no extra interpretation to an action choice."
    p4: "The players cooperate on five color-specific public fireworks. Every firework follows ranks 1, 2, 3, 4, 5 in order, never duplicating or skipping a rank. The team score is the episode return for both players, up to 25. Only game mechanics and data formats are specified here; no additional meaning is attached to a player's selection of an action."
    p5: "The team score, shared by both players as episode return, has a maximum of 25. To score, the two players cooperate in building five public fireworks, one per color, containing ranks 1, 2, 3, 4, 5 in order without duplication or skipping. This specification describes the mechanics and data formats, leaving action choices without any additional assigned meaning."
  - source: "Each player sees the identities and ordering of the other player's cards but not the identities of their own cards or the order of the draw pile. Both see public firework heights, discard counts, information tokens, lives, deck size, and the most recent action and its public outcome. Hints and the identities of played/discarded cards are public. The partner's private memory is never an observation. The player's own private memory may persist within an episode."
    p1: "A player's observation reveals the other player's card identities and their order, but hides their own card identities and the draw-pile order. Firework heights, discard counts, information tokens, lives, deck size, and the latest action with its public outcome are visible to both. Hints and identities of played/discarded cards are public too. The partner's private memory is never observed; a player's own private memory can persist during an episode."
    p2: "Neither a player's own card identities nor the draw-pile order is visible to that player. The partner's card identities and ordering are visible. Both players see firework heights, discard counts, information tokens, lives, deck size, and the latest action's public outcome together with the action. Hints and played/discarded card identities are public information. Private memory can persist within the episode for its owner, but the partner's private memory is never part of an observation."
    p3: "Players can see the identity and position of each card in the other hand, not the identities in their own hand or the ordering of the draw pile. Shared visible information includes firework heights, discard counts, information tokens, lives, deck size, and the most recent action and public result. Hints and the identities of played/discarded cards are also public. Each player may keep private memory across the episode; the other player's private memory is never observed."
    p4: "The public information available to both seats includes firework heights, discard counts, information tokens, lives, deck size, hints, played/discarded card identities, and the latest action and its public outcome. Each player additionally sees the identities and ordering of the other player's cards. Own card identities and draw-pile order remain hidden. A player's private memory may persist within an episode, but a partner's private memory is never an observation."
    p5: "The other hand's card identities and ordering are visible to each player, whereas their own card identities and the draw pile's order are hidden. Both observe public firework heights, discard counts, information tokens, lives, deck size, and the most recent action with its public outcome. Hints and played/discarded card identities are public. Private memory belonging to a player can persist within the episode and is never observable by the partner."
  - source: "One environment transition executes one active player's action, then changes the active player. Both policy instances are called on every transition, so both receive the public result of the previous turn. Only one seat is active."
    p1: "On each transition the environment executes the active player's action and then switches the active player. Every transition calls both policy instances, giving both the previous turn's public result. A single seat is active at a time."
    p2: "Only one seat acts as the active player. A transition executes that player's action before transferring activity to the other player. Both policy instances are called at every transition and therefore both obtain the public result of the preceding turn."
    p3: "The active player changes after their action is executed in an environment transition. Although only one seat is active, both policies are called on every transition and both receive the previous turn's public outcome."
    p4: "Each environment transition handles the action of the sole active player and then changes who is active. Calling both policy instances at every transition lets each receive the public result of the prior turn."
    p5: "Every transition calls both policies, so each receives the public result of the previous turn. Just one seat is active: the environment executes its action and then changes the active player."
  - source: "A true mask entry means the action is allowed by the game rules, not that it will score points. In particular, legality of playing a card does not reveal whether that card will succeed."
    p1: "A true entry identifies an action permitted by the rules, without promising points. In particular, a card's legal play status gives no indication of whether playing it succeeds."
    p2: "The mask indicates rule legality rather than scoring potential. A true entry allows the action; for card plays, legality does not disclose whether the play would succeed."
    p3: "An allowed action has a true mask entry, but this is not evidence that it earns points. Whether a card play succeeds cannot be inferred from the legality of that play."
    p4: "Being permitted under the rules, indicated by a true mask entry, does not imply scoring points. Legal card plays are not thereby revealed to be successful."
    p5: "The meaning of a true mask entry is permission under the game rules, not a guarantee of points. In particular, legal status for playing a card does not reveal its success."
  - source: "A successful rank-5 play also restores one information token, capped at eight. An unsuccessful play does not restore a token. Hints may be repeated, even if all their literal information was already known. An empty hint is illegal. A hint refers to all matching cards; the sender cannot select only some of them. For the named attribute, matched slots have that value and unmatched occupied slots do not. Hinting changes no card positions and draws no cards."
    p1: "Completing a successful rank-5 play restores one information token, up to eight; a failed play restores none. Repeating a hint is allowed even when its literal information is already fully known, but an empty hint is illegal. Every matching card is included, rather than a sender-chosen subset. Matched slots have the named attribute value and unmatched occupied slots lack it. No cards move or are drawn when hinting."
    p2: "Hinting neither repositions cards nor draws cards. A hint covers all cards that match, not a subset chosen by the sender: the named attribute value holds in matching slots and not in unmatched occupied slots. Empty hints are illegal; repeats remain legal even if all the literal information is known already. A successful rank-5 play additionally restores one information token with a cap of eight, whereas an unsuccessful play restores none."
    p3: "One information token is restored by a successful rank-5 play, without exceeding eight. Unsuccessful plays restore no token. Hints are repeatable even when they add no new literal information, but they cannot be empty. The sender must include every match. Slots that match have the named attribute value; unmatched occupied slots do not. Hints leave card positions unchanged and do not cause draws."
    p4: "An empty hint is not legal, but repeating a hint whose literal information is entirely known is legal. The sender does not choose a subset: all matching cards are identified. The named attribute value is present in matched slots and absent in unmatched occupied slots. Hinting moves no cards and draws none. A successful rank-5 play also restores one information token, capped at eight; a failed play does not."
    p5: "A successful rank-5 play returns one information token, subject to the eight-token cap; unsuccessful plays return no token. Hints may repeat known literal information but must not be empty. All matching cards are addressed, never only a subset chosen by the sender. Matched slots possess the named attribute value and unmatched occupied slots do not. Neither card positions nor draws change as a result of hinting."
  - source: "Whenever a card is played or discarded, remove that slot, shift all later slots one position left, and append the next draw at slot 4 if the deck was nonempty. Otherwise append an empty slot. This happens regardless of whether a play succeeds. Public hint records move with the shifted cards. A new draw has no previous hints. Slots are current positions, not stable card IDs."
    p1: "Playing or discarding removes the chosen slot and shifts each later slot one place left. Append the next drawn card at slot 4 if the deck contained cards; otherwise append an empty slot. This procedure also applies to unsuccessful plays. Public hint records shift with their cards, and new draws begin without previous hints. Slots identify current positions rather than stable card IDs."
    p2: "Slots represent present hand positions, not permanent card IDs. After a play or discard, remove its slot and move all subsequent slots one place to the left. If the deck was nonempty, put the next draw at slot 4; if not, append an empty slot. Success of the play does not affect this procedure. Hint records travel with shifted cards, while newly drawn cards have no prior hints."
    p3: "A played or discarded card leaves a slot that is removed; all later slots shift left by one. Slot 4 receives the next draw when the deck was nonempty, or an empty slot is appended otherwise. Successful and failed plays use the same procedure. Public hints remain attached to cards as they shift. New cards have no earlier hints, and slots are current positions rather than stable IDs."
    p4: "The hand is compacted after every play or discard: remove that slot and shift all later slots left one position. Append a draw at slot 4 when the deck was nonempty, otherwise append an empty slot. This is independent of play success. Public hint records shift with the cards they describe, and a new draw starts with no previous hints. Slot numbers denote current positions, not stable card IDs."
    p5: "After playing or discarding, the removed slot is closed by shifting every later slot one position left. The next draw is appended at slot 4 if the deck was nonempty; otherwise an empty slot is appended. The same rule holds if a play fails. Public hint records follow shifting cards and new draws carry no prior hints. Slots track current positions instead of stable card IDs."
  - source: "The hand, board, discard and knowledge blocks describe the state after this action; the removed-slot field refers to the state before it. The last-action block is replaced on every transition and is not an accumulated history. The active actor therefore alternates, but both seats can read each result."
    p1: "Hand, board, discard, and knowledge blocks reflect the post-action state, whereas the removed-slot field identifies a slot in the pre-action state. Each transition overwrites the last-action block instead of accumulating history. The acting player alternates, and both seats can read each result."
    p2: "The removed-slot field uses the state before the action; hand, board, discard, and knowledge blocks use the state after it. Last-action information is replaced each transition, not appended into a history. Activity alternates between actors while both seats can observe every result."
    p3: "Each transition replaces the last-action block, so it stores no cumulative history. The hand, board, discard, and knowledge blocks show the resulting state, while the removed-slot field refers to the preceding state. Actors alternate and both seats may read each outcome."
    p4: "Both seats can read every result even though the active actor alternates. The last-action block is overwritten on each transition rather than retaining a history. Hand, board, discard, and knowledge describe the state after the action; the removed-slot field describes its pre-action slot."
    p5: "The last-action block records only the latest transition and is replaced rather than accumulated. Its removed-slot field refers to the state before the action, unlike the hand, board, discard, and knowledge blocks, which describe the state afterward. Both seats can read each result as the active actor alternates."
  - source: "When the last draw is taken, the native final-round counter begins. There are two further active-player turns: one for the other player and one for the player who drew the last card, unless another termination condition occurs first. There are no further draws. Hints still consume these turns. At final round completion, the return is the sum of firework heights, unless all lives were lost. The end of the deck alone does not immediately end the episode."
    p1: "Taking the final draw starts the native final-round counter. Unless another ending occurs sooner, two active-player turns remain: first the other player's turn, then the final drawer's turn. No more cards are drawn, and hints use up turns as usual. When the final round finishes, return equals the summed firework heights unless all lives were lost. An empty deck by itself does not immediately terminate play."
    p2: "The deck running out is not an immediate episode ending. Drawing its last card starts the native final-round counter, allowing two more active-player turns unless another termination condition comes first: the other player acts, then the player who drew last. These turns have no draws, and giving a hint consumes a turn. The final-round return is the sum of firework heights except when all lives have been lost."
    p3: "The native final-round counter is triggered by taking the last draw. In the absence of an earlier termination, the other player receives a turn and then the last-drawing player receives a turn, for two further active-player turns in total. Further draws are unavailable; hints still consume turns. At final-round completion the sum of firework heights is the return unless all lives were lost. Deck exhaustion alone does not end the episode immediately."
    p4: "Two active-player turns follow the final draw, unless another termination condition intervenes. The native final-round counter starts with that draw; the other player acts next, followed by the player who drew the final card. There are no additional draws, and hints count as turns. Return at the end of the final round is the sum of firework heights unless all lives were lost. Merely reaching the deck's end does not immediately end the episode."
    p5: "An episode does not stop immediately just because the deck is exhausted. The last draw begins the native final-round counter: the other player and then the last drawer get one further active turn each, unless play terminates sooner for another reason. No draws remain, but hints still take turns. Once the final round ends, return is the sum of firework heights unless all lives have been lost."
