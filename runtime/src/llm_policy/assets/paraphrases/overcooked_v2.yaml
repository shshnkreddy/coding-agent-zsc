    p1: "The three players work together to deliver dishes that match the current recipe. Preparing a dish requires placing raw ingredients in a pot, cooking them, taking the cooked contents with an empty plate, and using the delivery station while carrying that plated dish. Matching depends on ingredient counts, not the order in which ingredients entered the pot. Cooking is possible for mixed or otherwise incorrect dishes too, but delivering them does not count as a correct delivery."
    p2: "The three-player cooperative task is to prepare the requested recipe and deliver it. Raw ingredients go into a pot and cook; an empty plate collects the cooked contents, and the player holding the plated dish interacts with the delivery station. The recipe is checked by counting ingredients, regardless of their insertion order. A mixed dish or another incorrect combination can cook without qualifying as a correct delivery."
    p3: "Three players jointly prepare and deliver dishes for the recipe currently requested. To make a dish, add raw ingredients to a pot, allow cooking to finish, collect its cooked contents with an empty plate, then interact with the delivery station while holding the plated result. Ingredient counts determine a match; the insertion sequence is irrelevant. Mixed and other incorrect dishes may cook, although they are not correct deliveries."
    p4: "Delivering a dish is correct when its ingredient counts match the currently requested recipe. The three players cooperate to do this by loading raw ingredients into a pot, cooking them, collecting the cooked contents on an empty plate, and interacting with a delivery station while carrying the plated dish. Insertion order has no effect on recipe matching. A mixed or otherwise incorrect dish can be cooked but is not a correct delivery."
    p5: "The shared task is delivery of dishes matching the current request. All three players cooperate in a preparation process: put raw ingredients into a pot, let them cook, collect the cooked contents using an empty plate, and interact with a delivery station while holding the plated dish. Counts of ingredients, rather than insertion order, decide recipe matching. Mixed or otherwise incorrect dishes still can cook, but do not constitute correct deliveries."
  - source: "The layout is information available before play. Global player coordinates are not separately supplied to the policy; runtime inputs are described below."
    p1: "Players have the layout information before play begins. The policy does not receive a separate global-player-coordinate input; its runtime inputs are specified below."
    p2: "The layout is supplied in advance of play, but global player coordinates are not a separate policy input. The runtime inputs appear below."
    p3: "Before the episode, the layout is available as information. Runtime inputs, described below, do not separately provide global player coordinates."
    p4: "Knowing the layout before play does not mean receiving global player coordinates as a separate policy input. See below for the runtime inputs."
    p5: "The available pre-play information includes this layout. No separate global player coordinates are passed to the policy; the runtime input description follows below."
  - source: "The new recipe is used by both the always-on indicator and any button that is still active. An active button displays the current recipe, not a frozen copy of the recipe at activation. Existing pot contents and held dishes are not changed when the target recipe changes."
    p1: "Both the always-on indicator and any still-active button use the new recipe. A button that remains active shows the recipe currently requested rather than preserving the recipe from its activation. Changing the target leaves existing pot contents and carried dishes untouched."
    p2: "The always-on indicator and still-active buttons reflect the new recipe. Active buttons track the current recipe instead of retaining an activation-time copy. A change of target recipe does not alter dishes being held or ingredients already in pots."
    p3: "After a recipe change, the always-on indicator and each active button use that new recipe. Button displays are current, not snapshots taken at activation. Existing pot contents and held dishes remain as they were."
    p4: "A held dish or existing pot contents do not change with the target recipe. The always-on indicator and any button still active do use the new target: an active button displays the current recipe, not the one captured at activation."
    p5: "New target recipes update both the always-on indicator and all buttons that are still active. Thus an active display is not frozen to its activation-time recipe. Pots retain their existing contents, and held dishes are unchanged."
  - source: "A player has one inventory slot: empty hands, one raw ingredient, one empty plate, or one plated cooked dish. Supplies are inexhaustible. Objects cannot be picked up from a distance, and items cannot be passed directly to the other player."
    when: {num_agents: 2}
    p1: "Each player has a single inventory slot, containing nothing, one raw ingredient, one empty plate, or one plated cooked dish. Supplies never run out. Pickup at a distance and direct handoff to the other player are not available."
    p2: "A player's inventory is limited to one slot: empty hands or one raw ingredient, empty plate, or plated cooked dish. There is no depletion of supplies. Neither remote pickup nor direct transfer of items to the partner is possible."
    p3: "Supplies are unlimited, but each player can hold only one raw ingredient, one empty plate, or one plated cooked dish in their single inventory slot; otherwise their hands are empty. Items cannot be picked up remotely or handed directly to the other player."
    p4: "The single inventory slot can be empty or hold one raw ingredient, one empty plate, or one plated cooked dish. Supply objects are inexhaustible. Players cannot take objects from a distance or pass held items directly to one another."
    p5: "Inventory consists of one slot per player. Its possibilities are empty hands, one raw ingredient, one empty plate, and one plated cooked dish. Supplies do not run out, and neither distant pickup nor direct player-to-player item passing is allowed."
