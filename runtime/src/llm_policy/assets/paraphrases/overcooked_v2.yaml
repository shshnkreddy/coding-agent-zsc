  - source: "There is no counter item swapping: occupied hands cannot pick up an item from an occupied counter. There is no trash action, chopping action, or direct pickup of uncooked pot contents. A plate cannot scoop a cooking/uncooked pot. Ingredients cannot be added to cooking or cooked contents. Finished food does not burn or spoil."
    p1: "Counter items cannot be swapped: a player whose hands are occupied cannot pick up from an occupied counter. No trash action, chopping action, or direct pickup of uncooked pot contents is available. Plates cannot scoop from cooking/uncooked pots, and no ingredients may be added to contents already cooking or cooked. Cooked food neither burns nor spoils."
    p2: "Occupied hands cannot collect an item from an occupied counter, so counters do not support item swaps. Trash and chopping actions, and direct pickup of uncooked pot contents, are absent. A cooking/uncooked pot cannot be scooped with a plate. Adding ingredients to cooking or cooked contents is impossible. Finished food is not subject to burning or spoilage."
    p3: "Finished food remains unburned and unspoiled. Ingredients may not be added once contents are cooking or cooked, and plates cannot scoop cooking/uncooked pots. Direct pickup of uncooked pot contents, trash actions, and chopping actions do not exist. Nor can items be swapped on counters: occupied hands cannot pick up from an occupied counter."
    p4: "A counter cannot exchange its item for a held item; occupied hands cannot pick up an item from an occupied counter. There is no trash or chopping action, or action for direct pickup of uncooked pot contents. A plate cannot scoop a cooking/uncooked pot, and cooking or cooked contents accept no additional ingredients. Finished food never burns or spoils."
    p5: "No chopping, trash, or direct uncooked-pot pickup action is provided. A plate does not scoop a cooking/uncooked pot; ingredients cannot enter contents that are cooking or already cooked. Food that has finished cooking does not burn or spoil. Counter swapping is also absent: occupied hands cannot pick up from an occupied counter."
  - source: "The button countdown is **not an observation channel**. Visibility is represented by nonzero recipe counts at its cell while active. Only pots expose their numeric countdown. The always-on recipe indicator does not expire and costs nothing to view."
    p1: "The numeric countdown is exposed for pots only: the button countdown is **not an observation channel**. An active button's visible display consists of nonzero recipe counts at its cell. Viewing the always-on recipe indicator has no cost, and that indicator never expires."
    p2: "Nonzero recipe counts at an active button's cell represent its visible display. Its countdown is **not an observation channel**; only pot countdowns are numerically exposed. The always-on indicator has no expiry and can be viewed at no cost."
    p3: "The always-on recipe indicator remains available without expiring, and viewing it is free. For a button, visibility is given by nonzero recipe counts at its cell while active. The button countdown is **not an observation channel**: only pots provide a numeric countdown."
    p4: "While a button is active, nonzero recipe counts at its cell encode display visibility. The button countdown is **not an observation channel**. Numeric countdown observations belong only to pots. The always-on recipe indicator neither expires nor charges for viewing."
    p5: "Only pots reveal their numeric countdowns. The button countdown is **not an observation channel**; instead, its cell has nonzero recipe counts when the display is active and visible. There is no viewing cost or expiration for the always-on recipe indicator."
  - source: "There is no ordinary time penalty. The environment may report auxiliary shaping diagnostics, but they are not added to the cooperative return used for policy scoring."
    p1: "Ordinary elapsed time carries no penalty. Auxiliary shaping diagnostics may be reported by the environment, but the cooperative return used to score policies excludes them."
    p2: "No ordinary time penalty is applied, and any auxiliary shaping diagnostics the environment reports are excluded from the cooperative return used for policy scoring."
    p3: "The cooperative return used for policy scoring does not include any reported auxiliary shaping diagnostics. There is no ordinary penalty for time passing."
    p4: "Time has no ordinary penalty. Although auxiliary shaping diagnostics may appear in environment reports, they do not contribute to the cooperative return that scores the policy."
    p5: "Policy scoring uses cooperative return without adding auxiliary shaping diagnostics that the environment may report. Ordinary time passage is not penalized."
  - source: "Unfinished food and held items have no terminal bonus. The environment does not terminate merely because an incorrect dish was prepared or a button cost was incurred."
    p1: "No terminal bonus is given for unfinished food or items in hand. Preparing an incorrect dish or incurring a button cost alone does not terminate the environment."
    p2: "Items held at termination and food still unfinished yield no terminal bonus. Neither preparation of an incorrect dish nor a button charge by itself ends the environment."
    p3: "A button cost or the preparation of an incorrect dish is not, by itself, a termination trigger. There is no terminal bonus for unfinished food or held items."
    p4: "Unfinished food and carried items earn no bonus on termination. The environment does not end solely from preparing the wrong dish or paying a button cost."
    p5: "Merely preparing an incorrect dish or incurring a button cost does not end the environment. Unfinished food and items still held receive no terminal bonus."
  - source: "Floor has no dedicated static channel: within the known map it is a cell with no static-object or ingredient-supply flag. Counter contents and pot contents appear in the grid-item block; held contents appear only in the player inventory blocks. Recipe display features are separate from actual items on those cells. An all-zero recipe block means no recipe is displayed there; it does not denote an empty target recipe."
    p1: "There is no dedicated static channel for floor. Inside the known map, a floor cell has neither a static-object flag nor an ingredient-supply flag. The grid-item block contains counter and pot contents; player inventory blocks alone contain held contents. Recipe displays are encoded separately from the actual items at their cells. An all-zero recipe block indicates absence of a displayed recipe, not an empty target recipe."
    p2: "Within the known map, floor is identified by the absence of static-object and ingredient-supply flags rather than by its own static channel. Contents of pots and counters occupy the grid-item block, while held contents occur only in player inventory blocks. Actual cell items and recipe display features are separate. A recipe block of all zeros means nothing is displayed, not that the target recipe is empty."
    p3: "Recipe display features do not describe the actual items at those cells. All-zero recipe blocks indicate no displayed recipe rather than an empty target. Counter and pot contents are in the grid-item block, and held contents are only in player inventory blocks. Floor has no separate static channel: a floor cell in the known map has no static-object or ingredient-supply flag."
    p4: "Counter and pot contents use the grid-item block; only player inventory blocks show held contents. Recipe display features are distinct from actual cell items, and an all-zero recipe block means no recipe is displayed rather than an empty target. No static channel is dedicated to floor: inside the known map, floor cells lack static-object and ingredient-supply flags."
    p5: "Floor is not assigned a dedicated static channel. A cell within the known map is floor when neither static-object nor ingredient-supply flags are present. Grid-item blocks show counter and pot contents, and player inventory blocks are the sole location of held contents. Recipe displays are distinct from actual items on their cells. An all-zero recipe block signifies no display, not an empty requested recipe."
