replacements:
  - source: "Two players cooperate to prepare and deliver dishes matching the currently requested recipe. A dish is made by putting raw ingredients into a pot, letting them cook, collecting the cooked contents with an empty plate, and interacting with a delivery station while holding the plated dish. Recipe matching uses ingredient counts; ingredient insertion order does not matter. A mixed or otherwise incorrect dish can still cook, but is not a correct delivery."
    when: {num_agents: 2}
    p1: "The two players work together to deliver dishes that match the current recipe. Preparing a dish requires placing raw ingredients in a pot, cooking them, taking the cooked contents with an empty plate, and using the delivery station while carrying that plated dish. Matching depends on ingredient counts, not the order in which ingredients entered the pot. Cooking is possible for mixed or otherwise incorrect dishes too, but delivering them does not count as a correct delivery."
    p2: "The cooperative task is to prepare the requested recipe and deliver it. Raw ingredients go into a pot and cook; an empty plate collects the cooked contents, and the player holding the plated dish interacts with the delivery station. The recipe is checked by counting ingredients, regardless of their insertion order. A mixed dish or another incorrect combination can cook without qualifying as a correct delivery."
    p3: "Players jointly prepare and deliver dishes for the recipe currently requested. To make a dish, add raw ingredients to a pot, allow cooking to finish, collect its cooked contents with an empty plate, then interact with the delivery station while holding the plated result. Ingredient counts determine a match; the insertion sequence is irrelevant. Mixed and other incorrect dishes may cook, although they are not correct deliveries."
    p4: "Delivering a dish is correct when its ingredient counts match the currently requested recipe. The two players cooperate to do this by loading raw ingredients into a pot, cooking them, collecting the cooked contents on an empty plate, and interacting with a delivery station while carrying the plated dish. Insertion order has no effect on recipe matching. A mixed or otherwise incorrect dish can be cooked but is not a correct delivery."
    p5: "The shared task is delivery of dishes matching the current request. Both players cooperate in a preparation process: put raw ingredients into a pot, let them cook, collect the cooked contents using an empty plate, and interact with a delivery station while holding the plated dish. Counts of ingredients, rather than insertion order, decide recipe matching. Mixed or otherwise incorrect dishes still can cook, but do not constitute correct deliveries."
  - source: "Three players cooperate to prepare and deliver dishes matching the currently requested recipe. A dish is made by putting raw ingredients into a pot, letting them cook, collecting the cooked contents with an empty plate, and interacting with a delivery station while holding the plated dish. Recipe matching uses ingredient counts; ingredient insertion order does not matter. A mixed or otherwise incorrect dish can still cook, but is not a correct delivery."
