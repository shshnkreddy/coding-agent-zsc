replacements:
  - source: "A connection uses horizontal or vertical neighbors, never diagonals. For a color to count as connected, paths between its cards must use only cards of that color. Different colors may touch; there is no requirement to separate them by empty space. Colors need not form rows, columns or any prescribed shape. The entire board must remain connected by orthogonal card adjacency after each legal move, regardless of colors."
    p1: "Connections run between horizontal or vertical neighbors, not diagonal ones. A color is connected only when its cards are linked through cards of that same color. Cards of different colors can touch, with no required empty gap between them. Neither rows, columns, nor another fixed shape are required. After every legal move, orthogonal adjacency must keep the entire board connected without regard to card colors."
    p2: "Diagonal neighbors do not connect; horizontal and vertical neighbors do. Paths connecting cards of a color must stay within that color. Different colors need not be separated by empty cells and may touch. No row, column, or other prescribed shape is required for a color. Independently of colors, every legal move must leave the whole board connected through orthogonal card adjacency."
    p3: "After a legal move, the whole board must still be connected by orthogonal card adjacency irrespective of color. Color connectivity has the additional requirement that paths use only cards of that color. Only horizontal and vertical neighbors connect, never diagonals. Different colors may touch without empty space between them, and a color is not required to form a row, column, or other designated shape."
    p4: "Horizontal or vertical card neighbors establish connections, whereas diagonal neighbors do not. A color's cards must connect by paths containing that color alone. There is no prescribed row, column, or shape for a color, and touching another color is allowed without an empty-space separator. Legal moves must also preserve whole-board connectivity under orthogonal adjacency, ignoring colors."
    p5: "For connectivity, use horizontal and vertical neighbors rather than diagonals. A same-color connection requires a path made entirely of that color's cards. Colors may border one another, do not need empty gaps, and are not constrained to rows, columns, or any particular shape. Every legal move leaves all cards connected as a board by orthogonal adjacency regardless of their colors."
  - source: "Cards begin face down, and private observations reveal their colors only to the observing player. There are no walls, draw pile, replacement cards, color changes or removed cards."
    p1: "Cards start face down; a private observation reveals a card's color only to its observer. Walls, a draw pile, replacement cards, changing colors, and removed cards are absent."
    p2: "Cards initially lie face down, and a private observation reveals a card's color only to the player making that observation. The game has no walls or draw pile, no replacement or removed cards, and no color changes."
    p3: "Cards are initially face down; a private observation makes a card's color visible to the observing player alone. There are no walls, no draw pile, no replacement cards, no changes of color, and no removed cards."
    p4: "Cards begin face down. Private observations expose their colors only to the player who observes them. Cards are not replaced, removed, or recolored, and there are neither walls nor a draw pile."
    p5: "Every card starts face down with its color hidden. Observing it privately reveals the color to that player only. Neither walls nor a draw pile exist, and there are no replacement cards, color changes, or removed cards."
  - source: "A hint may legally be placed on a card whose true color is absent from its set. This is an incorrect hint for scoring, but the move is still legal and does not reveal the hidden card color. No convention for interpreting a player's choice of hint, observation or movement is supplied."
    p1: "A card can legally receive a hint even when its true color is not in the hint's set. That placement counts as an incorrect hint for scoring, yet remains legal and does not expose the hidden color. No supplied convention assigns meaning to a player's hint, observation, or movement choice."
    p2: "Hint placement legality does not require the card's true color to belong to the hint's set. A mismatch is incorrect for scoring purposes but legal to place, without revealing the hidden card color. Interpretations of players' hint, observation, and movement choices have no supplied convention."
    p3: "The hidden card color is not revealed by placing a hint. Placement is legal even if that color is missing from the hint's set, although such a hint is incorrect when scored. No convention is provided to interpret the player's selection of a hint, observation, or movement."
    p4: "A hint set need not contain a card's true color for placement to be legal. When it does not, the hint is incorrect for scoring but the placement is still legal and keeps the card color hidden. There is no supplied convention governing how to interpret hint choices, observation choices, or movements."
    p5: "Placing a hint on a card outside its color set is permitted by the rules. It is scored as an incorrect hint, not as an illegal move, and it does not reveal the hidden card color. The description supplies no convention for interpreting a player's choice of hint, observation, or movement."
  - source: "A move is a relocation, not a path traversal: only the destination and the resulting whole-board connectivity are tested. There is no movement distance cost or requirement that the remaining board stay connected during an imagined intermediate removal. The moved card retains its ID, color and both players' observation history. Locked cards cannot move or be observed again. There is no swap action, no staying in the same cell, and no moving a hint separately."
    p1: "Movement relocates a card rather than following a path, so checks concern only the destination and the resulting connectivity of the whole board. Distance costs nothing, and the remaining cards need not stay connected during an imagined intermediate removal. The card keeps its ID, color, and observation history for both players. A locked card cannot be moved or observed again. Swapping, remaining in the same cell, and moving a hint by itself are unavailable."
    p2: "Only a move's destination and final whole-board connectivity are checked: the card is relocated, not carried along a path. No distance cost applies, nor must the remaining board be connected at an imagined removal stage. The moved card's ID, color, and both players' observation history persist. Locked cards allow neither movement nor further observation. There is no swapping, staying in place, or separate movement of hints."
    p3: "The moved card keeps its ID and color as well as both players' observation history. Movement is relocation, with tests only of the destination and resulting whole-board connectivity, not path traversal. It has no distance cost and imposes no connectivity requirement on an imagined intermediate board after removal. Locked cards cannot move or be observed again. Moves cannot swap cards, stay in the same cell, or move a hint separately."
    p4: "A movement action checks the destination and the whole board's connectivity after relocation; it does not trace a path. There is no charge for distance and no requirement for connectivity during an imagined intermediate removal. ID, color, and both players' observation histories stay with the moved card. Locked cards cannot be observed again or moved. Neither swapping nor staying in the same cell nor separate hint movement is an action."
    p5: "Relocating a card leaves its ID, color, and both players' observation history intact. Only the destination and final whole-board connectivity matter for the move, not a traversed path or imagined intermediate removal. Distance has no cost, and the board remaining during that imagined removal need not be connected. Locked cards cannot move or be observed again. No swap, same-cell stay, or separately moving a hint is allowed."
  - source: "With perfect memory enabled, during your active turns the own-color features expose every card you have personally observed at any earlier time in this episode, including moved or subsequently locked cards. Identity is attached to stable card ID. While your seat is inactive, all own-color features are zero, including previously observed colors. They reappear when your seat is active again. The other player’s private color observations are never added to your own-color features."
    p1: "When perfect memory is enabled and your seat is active, own-color features show every card you personally observed earlier in the episode, even if moved or later locked. Colors belong to stable card IDs. All own-color features, including previously observed colors, become zero during inactivity and reappear when your seat becomes active again. Your own-color features never incorporate the other player's private color observations."
    p2: "Perfect memory restores personally observed card colors to own-color features on your active turns throughout the episode. Stable card IDs retain these identities, including after movement or subsequent locking. Inactive seats have entirely zero own-color features, even for known colors; those colors reappear when the seat is active again. The partner's private color observations do not enter your own-color features."
    p3: "With perfect memory enabled, earlier personal observations in this episode remain available through own-color features whenever your seat is active. This includes moved and subsequently locked cards, whose identity follows the stable card ID. During inactivity all these features are zero, even previously seen colors, and they return on becoming active again. Colors privately observed by the other player are never added."
    p4: "Your own-color features do not include the other player's private color observations. Perfect memory instead exposes every card you personally observed earlier in this episode during your active turns. Stable card IDs preserve identity through movement or later locking. While inactive, your entire own-color feature block is zero, including known colors; those features reappear when you are active again."
    p5: "Perfect memory uses stable card IDs to expose all colors you personally observed earlier in the episode whenever your seat is active, including cards moved or subsequently locked. Inactivity masks every own-color feature to zero, even a previously observed color; becoming active restores them. The other player's private color observations are never transferred into your own-color features."
    when: {"past_colors_revealed":true}
  - source: "With perfect memory disabled, own-color features expose only cards observed during the current active turn. Those colors disappear at turn end. During inactivity all own-color features are zero. The policy may retain its own past observations in its private memory; the environment does not restore them in later observations."
    p1: "When perfect memory is disabled, own-color features show only cards observed in the current active turn and lose those colors at turn end. During inactivity all own-color features are zero. The environment does not recall these colors in later observations, although the policy can store its past observations in private memory."
    p2: "Without perfect memory, own-color features are limited to observations made in the current active turn. The colors vanish when the turn ends, and inactive seats have all-zero own-color features. A policy may remember its own observations privately; later environment observations do not restore them."
    p3: "The environment does not restore old observations when perfect memory is disabled. Own-color features show cards observed during the current active turn only; the colors disappear at its end. All own-color features are zero during inactivity. This does not prevent the policy from retaining its own past observations in private memory."
    p4: "Disabling perfect memory restricts own-color features to cards observed in the current active turn. Turn end removes those colors, and inactivity makes all own-color features zero. Private policy memory may still retain the player's earlier observations, but subsequent environment observations will not restore them."
    p5: "With perfect memory off, the current active turn's observed cards are the only colors exposed in own-color features. Those colors disappear at turn end; all own-color features are zero while inactive. The policy is free to retain its past observations in private memory, without the environment restoring them later."
    when: {"past_colors_revealed":false}
  - source: "With perfect memory, the partner-seen column records whether the other player has ever observed each card in this episode. Without perfect memory, it reports observations added during the current turn, and is cleared at every full-turn boundary. This indicator says which IDs were observed, never what colors the other player saw. Hint colors become public on reveal and remain public after placement. A known locked card's previously observed color still follows the configured memory rule; locking does not communicate that color to a partner."
    p1: "Under perfect memory, the partner-seen column indicates whether the partner has observed each card at any time this episode. Otherwise it reports observations added during the current turn and clears at each full-turn boundary. It reveals observed IDs, not the colors seen by the partner. Hint colors are public from reveal onward, including after placement. Previously observed colors of known locked cards obey the configured memory rule; locking does not tell the partner that color."
    p2: "The partner-seen indicator never reports which colors the other player saw, only which IDs they observed. With perfect memory it remembers observations throughout this episode; without it, only observations added during the current turn are reported, and every full-turn boundary clears the indicator. Revealed hint colors stay public after placement. A known locked card retains its previously observed color only as the configured memory rule specifies; locking itself does not convey the color to a partner."
    p3: "Perfect memory makes partner-seen report whether the other player has ever observed a card during the episode. Without perfect memory, the column contains observations added in the current turn and is reset at each full-turn boundary. What is indicated is the observed ID, never the observed color. Hint colors become public when revealed and stay public when placed. Previously seen colors on known locked cards remain subject to the memory configuration, and locking does not communicate those colors to the partner."
    p4: "Hint colors are public once revealed and remain so after placement. The partner-seen column tells which card IDs the other player observed, not what their colors were. Perfect memory keeps this indicator over the episode; otherwise it reports observations added during the current turn and clears at every full-turn boundary. For a known locked card, its previously observed color still obeys the configured memory rule. Locking is not disclosure of that color to a partner."
    p5: "Whether partner-seen spans the episode or just the current turn depends on perfect memory. If enabled, it records whether the partner ever observed each card this episode; if disabled, it records observations added in the current turn and clears at every full-turn boundary. It identifies cards observed, never colors seen. Hint colors remain public from reveal through placement. A known locked card's previously observed color follows the configured memory rule, not an additional disclosure to the partner when it is locked."
  - source: "There is no explicit last-action field, episode counter, hidden-color belief vector or simulator state in the observation. Policy memory and PRNG are private to each seat. The observation contains no recommendation of which card to observe, where to move it, which hint to use, or when to end."
    p1: "Observations include no explicit last-action field, episode counter, hidden-color belief vector, or simulator state. Each seat has its own private policy memory and PRNG. No observation recommends a card to observe, a move destination, a hint, or an ending time."
    p2: "Each seat's policy memory and PRNG are private. The observation has no explicit last-action field, episode counter, hidden-color belief vector, or simulator state, and gives no recommendation about what to observe, where to move, which hint to choose, or when to end."
    p3: "The observation supplies neither simulator state nor an explicit last-action field, episode counter, or hidden-color belief vector. Policy memory and PRNG belong privately to each seat. Advice about a card to observe, a destination, a hint, or an end decision is not part of the observation."
    p4: "No recommendation about observation choices, move locations, hint selection, or ending is encoded in the observation. It also has no explicit last-action field, episode counter, hidden-color belief vector, or simulator state. Every seat keeps its policy memory and PRNG private."
    p5: "An explicit last-action field, an episode counter, a hidden-color belief vector, and simulator state are all absent from observations. Memory and PRNG used by the policy are private per seat. Observations never recommend which card to observe, where to move it, what hint to use, or when to finish."
