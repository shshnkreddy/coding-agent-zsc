    p2: "The first player block always encodes self and the second partner, so the representation is observer-relative rather than seat-number-dependent. Invisible partner features are zero. A one-hot direction at the player's cell represents facing, not a rotated grid; inventory features are confined to that cell as well."
    p3: "Player blocks are observer-relative, with self first and partner second for either seat number. If the partner is invisible, its features are all zero. Facing uses a one-hot direction at the player's cell instead of rotating the grid. Inventory features likewise exist only at that player's cell."
    p4: "Seat number does not change block meanings: self comes first and partner second in this observer-relative encoding. Invisible partner features contain only zeros. Facing is encoded one-hot at the player's cell, without rotating the grid. Inventory features are also located only at that cell."
    p5: "In this observer-relative representation, the first player block describes self and the second describes partner regardless of seat number. Features of an unseen partner are all zero. The grid does not rotate for facing, which is one-hot at the player's cell; inventory features occur only there too."
