  - source: "The encoding is observer-relative: the first player block always describes self. The second block describes all other agents, summed across their distinct cells, independent of the seat number. Features for teammates outside the local view are all zero. Facing is a one-hot direction at the player's cell, not a rotation of the grid. Inventory features also occur only at that player's cell."
    when: {num_agents: 3}
    p1: "Encoding is relative to the observer: regardless of seat, the first player block is self and the second aggregates all other agents across their distinct cells. Features for teammates outside the local view are zero. Facing is a one-hot direction at the player's cell rather than a grid rotation, and inventory features occur only at that cell too."
    p2: "The first player block always encodes self and the second sums all other agents over their distinct cells, so the representation is observer-relative rather than seat-number-dependent. Out-of-view teammate features are zero. A one-hot direction at the player's cell represents facing, not a rotated grid; inventory features are confined to that cell as well."
    p3: "Player blocks are observer-relative, with self first and all other agents spatially aggregated in the second block for every seat number. Teammates outside the local view contribute only zeros. Facing uses a one-hot direction at the player's cell instead of rotating the grid. Inventory features likewise exist only at that player's cell."
    p4: "Seat number does not change block meanings: self comes first and all other agents are summed across their distinct cells in the second block. Features for teammates beyond the local view contain only zeros. Facing is encoded one-hot at the player's cell, without rotating the grid. Inventory features are also located only at that cell."
    p5: "In this observer-relative representation, the first player block describes self and the second spatially aggregates all other agents regardless of seat number. Features of teammates outside the local view are zero. The grid does not rotate for facing, which is one-hot at the player's cell; inventory features occur only there too."
