name: XP
metric: mean_directed_off_diagonal_cross_play_episode_return
instruction: >-
  Maximize expected cooperative episode return when either role of this joint
  policy is paired with the complementary role from an independently generated
  policy. Your policy will be paired with independently generated partners.
  It should coordinate with them without assuming they use the same strategy,
  role assignments, or communication conventions. Seek
  competent, convention-robust behavior that can coordinate from locally
  observable evidence. Self-play return is a useful competence diagnostic, but
  it is not the optimization target.
selection_rule: >-
  The primary evaluation metric is XP: cooperative episode return when this
  policy is paired with independently generated policies. You cannot measure
  XP within this isolated policy-search run; it is evaluated only after many
  independent policy-search runs have produced their policies. Use the
  available self-play rollouts to verify basic task competence and diagnose
  failures. Leave in policy.py the policy you judge most likely to achieve the
  highest expected cross-play return with independently generated partners.
  Use your analysis and available evaluation evidence to inform that judgment;
  the highest self-play score does not necessarily identify the best cross-play
  policy. Avoid relying on a private
  convention that succeeds only when both roles use this same policy.
evaluator: deferred_population_cross_play
