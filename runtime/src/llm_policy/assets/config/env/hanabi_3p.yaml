name: hanabi_3p
env_name: hanabi
env_kwargs:
  num_agents: 3
  num_colors: 5
  num_ranks: 5
  hand_size: 5
  max_info_tokens: 8
  max_life_tokens: 3
  num_cards_of_rank: [3, 2, 2, 2, 1]
llm_policy:
  policy_structure: shared_local
  fix_final_life_termination: true
evaluation:
  max_steps: 128
score_min: 0
score_max: 25
weight: 1.0
